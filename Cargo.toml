[package]
name = "tls-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0-rc.2"
anyhow = { version = "1.0.100" }
hex = "0.4.3"
num_enum = "0.7.5"
p256 = { version = "0.13.2", features = ["ecdh"] }
rand = "0.9.2"
rand_core = "0.6.4"
ring = "0.17.14"
tokio = { version = "1.48.0", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }